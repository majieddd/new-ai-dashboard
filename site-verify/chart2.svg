<svg class="chart" viewBox="0 0 850 380" role="img" aria-labelledby="icl2-title icl2-desc" xmlns="http://www.w3.org/2000/svg"><title id="icl2-title">Fixture diagnosis: shot labels surviving the 512-token context</title><desc id="icl2-desc">Long 200-token passages truncated: at 4 and 8 shots only 3 of the labels remained in context, so the mosaic arm was blind and every arm scored at or below chance. Short 48-token excerpts keep every label: 1, 2, 4, 9 labels survive. The fixed fixture reproduced the paper shot-curve.</desc><rect x="130" y="310" width="50" height="30" fill="#f4a393"/><rect x="190" y="310" width="50" height="30" fill="#71d7bf"/><text x="185" y="302" fill="#ecf2ff" text-anchor="middle" font-size="14">1</text><text x="245" y="302" fill="#ecf2ff" text-anchor="middle" font-size="14">1</text><text x="185" y="362" fill="#d5deef" text-anchor="middle" font-size="15">1 shots</text><rect x="310" y="280" width="50" height="60" fill="#f4a393"/><rect x="370" y="280" width="50" height="60" fill="#71d7bf"/><text x="365" y="272" fill="#ecf2ff" text-anchor="middle" font-size="14">2</text><text x="425" y="272" fill="#ecf2ff" text-anchor="middle" font-size="14">2</text><text x="365" y="362" fill="#d5deef" text-anchor="middle" font-size="15">2 shots</text><rect x="490" y="250" width="50" height="90" fill="#f4a393"/><rect x="550" y="220" width="50" height="120" fill="#71d7bf"/><text x="545" y="242" fill="#ecf2ff" text-anchor="middle" font-size="14">3</text><text x="605" y="212" fill="#ecf2ff" text-anchor="middle" font-size="14">4</text><text x="545" y="362" fill="#d5deef" text-anchor="middle" font-size="15">4 shots</text><rect x="670" y="250" width="50" height="90" fill="#f4a393"/><rect x="730" y="70" width="50" height="270" fill="#71d7bf"/><text x="725" y="242" fill="#ecf2ff" text-anchor="middle" font-size="14">3</text><text x="785" y="62" fill="#ecf2ff" text-anchor="middle" font-size="14">9</text><text x="725" y="362" fill="#d5deef" text-anchor="middle" font-size="15">8 shots</text><rect x="130" y="374" width="18" height="6" fill="#f4a393"/><text x="154" y="382" fill="#ecf2ff" font-size="13">long passages (truncated)</text><rect x="330" y="374" width="18" height="6" fill="#71d7bf"/><text x="354" y="382" fill="#ecf2ff" font-size="13">48-token excerpts (fixed)</text></svg>